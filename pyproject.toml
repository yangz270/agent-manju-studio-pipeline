[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-donghua-studio"
version = "4.5.0"
description = "Industrial-grade Commercial 3D Donghua / AI Short Drama Production Pipeline with 10 Multi-Agent Topology"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AI Donghua Studio Team"}]
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0"
]
